apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HuyPP/devops-lab'
    targetRevision: HEAD
    path: 'applications/product-service' # Đường dẫn tới thư mục chứa file deployment.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true      # Tự động xóa tài nguyên nếu bị xóa trên Git
      selfHeal: true   # Tự động sửa chữa nếu có ai đó sửa tay trên Cluster