apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartshop-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HuyPP/devops-lab'
    targetRevision: HEAD
    path: platform/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: smartshop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true