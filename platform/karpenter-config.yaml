apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  kubelet:
    maxPods: 11
  amiSelectorTerms:          
    - alias: al2023@latest   
  role: "smartshop-dev-node-role"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "smartshop-dev"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/smartshop-dev: "owned"
---
apiVersion: karpenter.sh/v1 
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default 
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.micro"] 
  limits:
    cpu: "50" 
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s